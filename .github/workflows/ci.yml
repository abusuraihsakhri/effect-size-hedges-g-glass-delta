name: Effect Size Hedges G Glass Delta CI/CD & Security Verification

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[web,test]"

    - name: Verify package installation and Python syntax
      run: |
        python -m compileall -q effect_sizes.py cli.py agents enrichment.py
        effect-size single --mean1 10 --mean2 8 --std1 2 --std2 2 --n1 30 --n2 30

    - name: Package and dependency consistency
      run: |
        python -m pip check
        python -m pip wheel --no-deps -w /tmp/effect-size-wheels .

    - name: Run Pytest Suite
      run: pytest -q

    - name: Browser JavaScript tests
      run: |
        node --check web/app.js
        node --test web/test-app.cjs

    - name: Security SAST & Zero-PHI Audit
      run: |
        python -c "
        from agents.base import PHIGuard, AuditLogger
        import pytest
        assert AuditLogger.verify_integrity() is True
        print('Security & Zero-PHI Audit Passed!')
        "

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the production Docker image
        run: docker build --tag effect-size-hedges-g-glass-delta:ci .
