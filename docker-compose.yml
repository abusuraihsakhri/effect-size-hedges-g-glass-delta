version: '3.8'

services:
  effect-size-hedges-g-glass-delta:
    build: .
    container_name: effect-size-hedges-g-glass-delta
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=effect-size-hedges-g-glass-delta-prod-audit-key-2026
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
